version: '3.8'

services:
  api:
    build: ./indotel-api
    container_name: indotel-api
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - sqlite_data:/app/database
    networks:
      - indotel-network

  web:
    build: ./indotel-web
    container_name: indotel-web
    restart: unless-stopped
    environment:
      - APP_ENV=${APP_ENV}
      - APP_DEBUG=${APP_DEBUG}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL}
      - INDOTEL_API_URL=${INDOTEL_API_URL}
      - DB_CONNECTION=${DB_CONNECTION}
      - DB_DATABASE=${DB_DATABASE}
    volumes:
      - sqlite_data:/app/database
      - ./indotel-web:/var/www/html
    depends_on:
      - api
    networks:
      - indotel-network

  nginx:
    image: nginx:stable-alpine
    container_name: indotel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./indotel-web:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - web
      - api
    networks:
      - indotel-network

  sqlite-web:
    image: coleifer/sqlite-web
    container_name: indotel-sqlite-ui
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - sqlite_data:/data
    command: sqlite_web -H 0.0.0.0 -x /data/indotel.db
    networks:
      - indotel-network

volumes:
  sqlite_data:
    driver: local

networks:
  indotel-network:
    driver: bridge
