memory_limit = 256M
max_execution_time = 60
post_max_size = 20M
upload_max_filesize = 20M

opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0

date.timezone = Asia/Jakarta
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
